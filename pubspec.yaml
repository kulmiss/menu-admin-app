name: menu_admin
description: "Menu Admin — the Menu platform's app for restaurant teams and the Super Admin."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^4.0.7
  connectivity_plus: ^7.3.2
  crypto: ^3.0.6
  device_info_plus: ^13.0.0
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  fl_chart: ^1.3.1
  flutter_image_compress: ^2.5.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  in_app_review: ^2.0.12
  in_app_update: ^5.0.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  # Android-only WebView settings (no file access) for the live preview.
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# App icon (concept B, QUESTIONS M22): `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  min_sdk_android: 26
  remove_alpha_ios: true

# Splash: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#F8FAFC"
  color_dark: "#020617"
  image: assets/icon/splash.png
  android_12:
    image: assets/icon/splash.png
    color: "#F8FAFC"
    color_dark: "#020617"
    icon_background_color: "#0F172A"
    icon_background_color_dark: "#0F172A"
  ios: true
  web: false
