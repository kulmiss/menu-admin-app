# Dependabot (free on private repos): monthly and grouped, so few PRs and few CI minutes.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      pub: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: gradle
    directory: /android
    target-branch: develop
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      gradle: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
