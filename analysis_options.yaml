include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/l10n/app_localizations*.dart
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: false

formatter:
  page_width: 160

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
    require_trailing_commas: false
    use_build_context_synchronously: false
